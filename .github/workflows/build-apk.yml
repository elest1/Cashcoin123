name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install & Build Web Assets
        working-directory: ./tg-cloud-gallery
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Make Gradle executable
        run: |
          chmod +x tg-cloud-gallery/android/gradlew

      - name: Build Debug APK
        working-directory: ./tg-cloud-gallery/android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Cloud-Drive-APK
          path: tg-cloud-gallery/android/app/build/outputs/apk/debug/app-debug.apk
